name: Auto Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时检查一次上游更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch all branches
        run: |
          git remote add upstream https://github.com/Kwisma/cf-worker-mihomo.git || true
          git fetch upstream
          git fetch origin --prune

      - name: Sync all upstream branches
        run: |
          # 获取上游所有分支（排除 HEAD 符号引用）
          UPSTREAM_BRANCHES=$(git branch -r | grep 'upstream/' | grep -v 'HEAD' | sed 's/.*upstream\///' | xargs)

          for BRANCH in $UPSTREAM_BRANCHES; do
            echo "=== 正在同步分支: $BRANCH ==="

            if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
              # 本地已存在该分支，使用 merge 保留本地更改
              echo "分支 $BRANCH 已存在，合并上游更改..."
              git checkout "$BRANCH"

              # 确保本地分支跟踪 origin 的对应分支
              git branch --set-upstream-to="origin/$BRANCH" "$BRANCH" 2>/dev/null || true
              git pull origin "$BRANCH" --rebase=false || true

              if git merge "upstream/$BRANCH" --no-edit; then
                echo "分支 $BRANCH 合并成功"
                git push origin "$BRANCH"
              else
                echo "⚠️ 分支 $BRANCH 存在冲突，中止合并（保留本地更改）"
                git merge --abort
              fi
            else
              # 本地不存在该分支，从上游创建
              echo "分支 $BRANCH 本地不存在，从上游创建..."
              git checkout -b "$BRANCH" "upstream/$BRANCH"
              git push origin "$BRANCH"
            fi
          done

      - name: Merge updated main into my-custom
        run: |
          if git show-ref --verify --quiet "refs/heads/my-custom"; then
            echo "=== 将 main 合并到 my-custom ==="
            git checkout my-custom
            git pull origin my-custom --rebase=false || true

            if git merge main --no-edit; then
              echo "main 已成功合并到 my-custom"
              git push origin my-custom
            else
              echo "⚠️ 合并 main 到 my-custom 时存在冲突，中止合并（保留本地更改）"
              git merge --abort
            fi
          else
            echo "my-custom 分支不存在，跳过合并"
          fi

      - name: Sync summary
        if: always()
        run: |
          echo "=== 同步完成 ==="
          echo "上游分支: $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | tr '\n' ' ')"
          echo "本地分支: $(git branch | tr '\n' ' ')"